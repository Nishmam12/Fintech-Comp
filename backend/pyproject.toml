[project]
name = "budget-kernel"
version = "0.1.0"
description = "Deterministic authorization kernel for delegated agent spending, with budget-aware model routing."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = ["concurrency: races against the real database", "slow: long property-based runs"]
