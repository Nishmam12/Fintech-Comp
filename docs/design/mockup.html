<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Kernel UI direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
  /* ============ Revision 3: full-bleed, viewport-filling, uniform scale ============
     One fluid root size; every other size is rem, so between 1280 and 2560 px the whole screen is a uniform zoom. */
  /* Proportional to the width (1.2vw), bounded by the height (2.1dvh) so nothing is ever clipped. At 16:9 every size has the
     same 83 x 47 rem canvas, so 1366, 1920 and 2560 are the same screen at different zoom. */
  html { font-size: clamp(14px, min(1.2vw, 2.1dvh), 40px); }
  @media (max-width: 767px) { html { font-size: 16px; } }

  :root {
    --paper: #f1f2ee; --sheet: #fbfbf8; --ink: #17201c; --ink-2: #3a453f; --muted: #5a635b; --rule: #d6d9d1;
    --approve: #1d6b47; --held: #8a5c00; --refuse: #a8361f;
    --gut: 1.5rem; --row: 3.5rem;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Archivo", system-ui, sans-serif;
         font-size: 0.9375rem; font-variation-settings: "wdth" 100; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .fig { font-variation-settings: "wdth" 125; font-weight: 700; letter-spacing: -0.01em; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- app frame: fills the viewport, no side gaps ---------- */
  .app { display: grid; grid-template-rows: auto auto 1fr; height: 100dvh; width: 100%; }
  .top { height: 4rem; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--gut); border-bottom: 1px solid var(--rule); }
  .brand { display: flex; align-items: baseline; gap: 1rem; }
  .brand b { font-size: 1.25rem; }
  .brand span { color: var(--muted); font-size: 0.875rem; }
  .who { display: flex; align-items: center; gap: 1rem; font-size: 0.875rem; }
  .who a { color: var(--muted); }
  .pill { padding: 0.125rem 0.75rem; border: 1px solid var(--ink); border-radius: 999px; font-size: 0.8125rem; }
  .tabs { height: 3rem; display: flex; gap: 2rem; padding: 0 var(--gut); border-bottom: 1px solid var(--rule); }
  .tabs a { display: flex; align-items: center; gap: 0.5rem; color: var(--muted); text-decoration: none; font-size: 0.9375rem; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a.on { color: var(--ink); border-color: var(--ink); font-weight: 600; }
  .count { font-size: 0.75rem; background: var(--held); color: #fff; padding: 0 0.5rem; border-radius: 999px; }
  .bottom { display: none; }

  .main { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
          column-gap: var(--gut); row-gap: var(--gut); padding: var(--gut); min-height: 0; }
  .main.rows-auto-fill { grid-template-rows: auto minmax(0, 1fr); grid-auto-rows: unset; }
  .c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c6 { grid-column: span 6; } .c4 { grid-column: span 4; }

  /* ---------- the one section module ---------- */
  .sec { display: flex; flex-direction: column; min-height: 0; }
  .sec-head { flex: none; height: 3.5rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem;
              padding-bottom: 0.75rem; border-bottom: 0.125rem solid var(--ink); }
  .sec-head h2 { margin: 0; font-size: 1.375rem; line-height: 1; }
  .sec-head .meta { color: var(--muted); font-size: 0.8125rem; }
  .sec-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  .sec-foot { flex: none; height: 2.5rem; display: flex; align-items: center; gap: 1.5rem; border-top: 1px solid var(--rule); font-size: 0.8125rem; color: var(--ink-2); }

  /* ---------- rows: equal height everywhere ---------- */
  .row { flex: none; height: var(--row); display: grid; align-items: center; column-gap: 1rem; border-bottom: 1px solid var(--rule); }
  .row.head { height: 2.5rem; font-size: 0.8125rem; color: var(--muted); }
  .num { text-align: right; }
  .name { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .name b { font-size: 0.9375rem; } .name em { font-style: normal; color: var(--muted); font-size: 0.8125rem; }
  .d1 .name { padding-left: 1rem; box-shadow: inset 2px 0 0 var(--rule); }
  .d2 .name { padding-left: 2rem; box-shadow: inset 2px 0 0 var(--rule), inset 1.125rem 0 0 var(--paper), inset 1.25rem 0 0 var(--rule); }
  .more { width: 2.5rem; height: 2rem; border: 1px solid var(--rule); background: transparent; border-radius: 0.375rem; font-size: 1.125rem; color: var(--ink-2); }
  .filler { flex: 1; min-height: 0; color: var(--muted); font-size: 0.875rem;
            background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--row) - 1px), var(--rule) calc(var(--row) - 1px), var(--rule) var(--row)); }
  .filler > p { height: var(--row); margin: 0; display: flex; align-items: center; }

  /* ---------- cheque ---------- */
  .cheque { position: relative; overflow: hidden; background: var(--sheet); border: 1px solid var(--ink); }
  .cheque svg.guilloche { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .6; pointer-events: none; }
  .cheque-in { position: relative; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gut);
               row-gap: 0.75rem; padding: 1rem 1.5rem; }
  .cheque .meta-line { display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--ink-2); }
  .serial { font-variation-settings: "wdth" 80; letter-spacing: .08em; }
  .amount { font-size: 3rem; line-height: 1; }
  .amount small { font-size: 0.35em; margin-left: 0.5rem; color: var(--ink-2); }
  .note { font-size: 0.9375rem; color: var(--ink-2); margin: 0.25rem 0 0; }
  .alloc { display: flex; height: 0.75rem; border: 1px solid var(--ink); }
  .alloc i { display: block; height: 100%; }
  .hatch { background: repeating-linear-gradient(90deg, var(--sheet) 0 0.375rem, #dfe3da 0.375rem 0.4375rem); }
  .legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--gut); }
  .legend div { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8125rem; color: var(--ink-2); }
  .legend span { display: flex; align-items: center; gap: 0.5rem; }
  .legend b { font-size: 1.125rem; color: var(--ink); }
  .sw { width: 0.625rem; height: 0.625rem; display: inline-block; }
  .seal-cell { border-left: 1px solid var(--rule); padding-left: var(--gut); display: flex; flex-direction: column; justify-content: center; gap: 0.75rem; }
  .seal-line { display: flex; align-items: center; gap: 1rem; }
  .seal-cell p { margin: 0; font-size: 0.875rem; color: var(--ink-2); }
  .seal-cell b { display: block; font-size: 1rem; color: var(--ink); }
  .seal-cell a { font-size: 0.875rem; }
  .seal { width: 3rem; height: 3rem; flex: none; }

  /* ---------- proposal -> verdict ---------- */
  .pairrow { grid-template-columns: minmax(0, 1fr) 1.5rem minmax(0, 1fr); }
  .slip { height: 3rem; display: flex; flex-direction: column; justify-content: center; padding: 0 0.75rem; font-size: 0.8125rem; min-width: 0; }
  .slip > * { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .proposal { border: 1.5px dashed var(--muted); color: var(--ink-2); }
  .proposal small { color: var(--muted); font-size: 0.75rem; }
  .verdict { border: 1.5px solid currentColor; background: var(--sheet); flex-direction: row; align-items: center; justify-content: flex-start; gap: 0.75rem; }
  .verdict p { margin: 0; color: var(--ink); }
  .stamp { flex: none; display: inline-block; font-variation-settings: "wdth" 115; font-weight: 800; font-size: 0.75rem; padding: 0.1875rem 0.625rem; box-shadow: inset 0 0 0 0.125rem currentColor; }
  .arrow { text-align: center; color: var(--muted); }
  .ok { color: var(--approve); } .wait { color: var(--held); } .no { color: var(--refuse); } .dim { color: var(--muted); }

  /* ---------- controls ---------- */
  label { display: block; font-size: 0.8125rem; color: var(--ink-2); margin: 1rem 0 0.5rem; }
  .field { width: 100%; height: 3rem; border: 1px solid var(--ink); background: var(--sheet); padding: 0 1rem; font: inherit; font-size: 1rem; }
  textarea.field { padding: 0.75rem 1rem; resize: none; height: auto; }
  .btn { height: 3rem; padding: 0 1.5rem; background: var(--ink); color: var(--paper); border: 0; font-weight: 600; font-size: 0.9375rem; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.small { height: 2.25rem; padding: 0 1rem; font-size: 0.875rem; }
  .btn.wide { width: 100%; }
  .chips { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(3.5rem, 1fr); gap: 0.5rem; margin: 1rem 0; }
  .chip { height: auto; border: 1px solid var(--rule); background: transparent; padding: 0 1rem; font-size: 0.9375rem; text-align: left; display: flex; flex-direction: column; justify-content: center; }
  .chip span { display: block; color: var(--muted); font-size: 0.8125rem; margin-top: 0.125rem; }

  /* Ask */
  .form { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .form textarea { flex: none; height: 6.5rem; }
  .pair { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 2rem minmax(0, 1fr); margin-top: 1rem; }
  .pair .slip { height: auto; padding: 0 1.5rem; font-size: 0.9375rem; }
  .pair .slip > * { white-space: normal; }
  .pair .proposal small { font-size: 0.875rem; margin: 0.25rem 0; }
  .pair .proposal span { font-size: 1.5rem; line-height: 1.3; }
  .pair .verdict { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0.75rem; }
  .pair .stamp { font-size: 1.5rem; padding: 0.3125rem 0.9375rem; box-shadow: inset 0 0 0 0.1875rem currentColor; }
  .pair .verdict p { font-size: 1.5rem; line-height: 1.3; }
  .pair .arrow { line-height: 2rem; }
  .consequence { flex: none; min-height: 3rem; margin: 1rem 0 0; font-size: 0.875rem; color: var(--ink-2); }

  /* Review cheques awaiting signature */
  .held-cheque { flex: none; border: 1px solid var(--ink); background: var(--sheet); padding: 1.25rem 1.5rem; margin-top: 1rem;
                 display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); column-gap: var(--gut); align-items: center; }
  .held-cheque .amount { font-size: 2.5rem; }
  .held-cheque .actions { display: grid; grid-template-rows: 1fr 1fr; gap: 0.5rem; }
  .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
  .cells.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell { height: 5rem; display: flex; flex-direction: column; justify-content: center; padding-left: 1rem; border-left: 1px solid var(--rule); }
  .cell:nth-child(3n+1) { border-left: 0; padding-left: 0; }
  .cells.four .cell:nth-child(3n+1) { border-left: 1px solid var(--rule); padding-left: 1rem; }
  .cells.four .cell:nth-child(2n+1) { border-left: 0; padding-left: 0; }
  .cells.four .cell:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
  .cell b { font-size: 1.5rem; } .cell span { font-size: 0.8125rem; color: var(--ink-2); }
  .explain { flex: none; margin: 0; padding: 1rem 0 0; font-size: 0.875rem; color: var(--ink-2); border-top: 1px solid var(--rule); }

  /* Activity timeline */
  .day { flex: none; height: 2.5rem; display: flex; align-items: flex-end; padding-bottom: 0.25rem; font-size: 0.8125rem; color: var(--muted); }
  .tl { grid-template-columns: 1.5rem minmax(0, 1fr) auto; }
  .dot { width: 0.625rem; height: 0.625rem; border-radius: 999px; background: currentColor; }

  /* Attack lab: rows share the height equally */
  .attack-body { display: grid; grid-auto-rows: minmax(4rem, 1fr); }
  .atk { height: auto; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) minmax(0, 3fr) minmax(0, 3fr) 7.5rem; }
  .atk .verdict { height: 3rem; }
  .atk .btn { white-space: nowrap; }

  /* Sign-in */
  .signin { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gut); height: 100dvh; padding: var(--gut); }
  .signin .cheque { grid-column: span 6; display: flex; }
  .signin .cheque-in { display: flex; flex-direction: column; justify-content: space-between; width: 100%; padding: 2.5rem; }
  .tagline { font-size: 4.5rem; line-height: 1.02; margin: 0; }
  .signin .side { grid-column: span 6; display: flex; flex-direction: column; min-height: 0; }
  .demo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); gap: 0.5rem; margin-top: 1rem; }
  .demo .btn { height: auto; display: flex; flex-direction: row; align-items: center; justify-content: space-between; text-align: left; padding: 0 1.5rem; font-size: 1.25rem; }
  .demo .btn span { font-weight: 400; font-size: 0.875rem; }
  .or { display: flex; align-items: center; gap: 1rem; color: var(--muted); font-size: 0.8125rem; margin: 1.5rem 0 0.75rem; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }

  /* ---------- tablet: halves stack, page scrolls ---------- */
  @media (max-width: 1023px) {
    .app { height: auto; min-height: 100dvh; }
    .main, .main.rows-auto-fill { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: auto; }
    .c12, .c8, .c6, .c4 { grid-column: 1 / -1; }
    .sec { min-height: 50dvh; }
    .signin { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 100dvh; row-gap: var(--gut); }
    .signin .cheque, .signin .side { grid-column: 1 / -1; }
    .signin .side { padding: 0; }
    .tagline { font-size: 3.25rem; }
  }
  /* ---------- phone: one column, pinned bars ---------- */
  @media (max-width: 767px) {
    :root { --gut: 1rem; }
    .brand span, .who > span:first-child, .who a, .tabs { display: none; }
    /* the page scrolls, so nothing inside is height-capped or clipped */
    .app { height: auto; min-height: 100dvh; grid-template-rows: auto auto; align-content: start; }
    .main, .main.rows-auto-fill { padding-bottom: 5rem; grid-auto-rows: auto; }
    .sec { min-height: 0; }
    .sec-body { overflow: visible; flex: none; }
    .sec-head { height: auto; min-height: 3.5rem; }
    .sec-head .meta { text-align: right; max-width: 55%; }
    .row { height: auto; min-height: var(--row); padding: 0.5rem 0; }
    .row.head { padding: 0; }
    .filler { min-height: calc(var(--row) * 2); flex: none; }
    .day { height: 2.5rem; }
    .form textarea { height: 6rem; }
    .chips { flex: none; }
    .pair { flex: none; grid-template-rows: auto 2rem auto; }
    .pair .slip { padding: 1rem; }
    .pair .proposal span, .pair .verdict p { font-size: 1.125rem; }
    .pair .stamp { font-size: 1.125rem; }
    .consequence { margin-bottom: 1rem; }
    .held-cheque .amount { font-size: 2rem; }
    .cell { height: 4.5rem; }
    .attack-body { grid-auto-rows: auto; }
    .atk { padding: 0.75rem 0; row-gap: 0.5rem; }
    .signin { padding: var(--gut); }
    .signin .cheque-in { padding: 1.5rem; gap: 2rem; }
    .tagline { font-size: 2.25rem; overflow-wrap: anywhere; margin-bottom: 1rem; }
    .demo { flex: none; grid-auto-rows: 3.5rem; }
    .demo .btn { font-size: 1.125rem; padding: 0 1rem; }
    .bottom { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; inset: auto 0 0 0; height: 3.5rem;
              border-top: 1px solid var(--rule); background: var(--sheet); font-size: 0.8125rem; }
    .bottom.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .bottom a { display: flex; align-items: center; justify-content: center; color: var(--muted); text-decoration: none; }
    .bottom a.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 2px 0 var(--ink); }
    .cheque-in { padding: 1rem; }
    .amount { font-size: 2.5rem; }
    .cheque .meta-line span:first-child { display: none; }
    .cheque .meta-line { justify-content: flex-start; }
    .cheque .c8, .cheque .c4 { grid-column: 1 / -1; }
    .seal-cell { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 0.75rem; }
    .legend { grid-template-columns: 1fr 1fr; row-gap: 0.75rem; }
    .ledger .row { grid-template-columns: minmax(0, 1fr) 6rem 2.5rem !important; }
    .ledger .row .hide-s { display: none; }
    .atk { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 5rem; }
    .atk .hide-s { display: none; }
    .held-cheque { grid-template-columns: minmax(0, 1fr); row-gap: 1rem; }
    .held-cheque .actions { grid-template-rows: none; grid-template-columns: 1fr 1fr; }
    .demo { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---------- gallery (only when no ?screen=) ---------- */
  .gallery { padding: 1.5rem; }
  .gallery h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .gallery .lead { color: var(--ink-2); margin: 0 0 1rem; max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  .controls button { border: 1px solid var(--ink); background: transparent; padding: 0.375rem 0.75rem; font-size: 0.875rem; }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 36rem), 1fr)); gap: 1.5rem; }
  .shot p { margin: 0 0 0.5rem; font-size: 0.875rem; color: var(--ink-2); }
  .viewport { position: relative; overflow: hidden; border: 1px solid var(--ink); background: #fff; }
  .viewport iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="root"></div>

<template id="t-top-owner">
  <header class="top"><div class="brand"><b class="fig">Budget Kernel</b><span>Models propose. The kernel decides.</span></div>
    <div class="who"><span>Nabil</span><span class="pill">Owner</span><a href="#">Sign out</a></div></header>
</template>
<template id="t-top-agent">
  <header class="top"><div class="brand"><b class="fig">Budget Kernel</b><span>Models propose. The kernel decides.</span></div>
    <div class="who"><span>Research bot</span><span class="pill">Agent</span><a href="#">Sign out</a></div></header>
</template>

<script>
const screens = {
  signin: { title: "Sign in" },
  mandate: { title: "Mandate (owner)", role: "owner", tab: "Mandate" },
  ask: { title: "Ask (agent)", role: "agent", tab: "Ask" },
  review: { title: "Review (owner)", role: "owner", tab: "Review" },
  activity: { title: "Activity (owner)", role: "owner", tab: "Activity" },
  attack: { title: "Attack lab (owner)", role: "owner", tab: "Attack lab" },
  settings: { title: "Settings (owner)", role: "owner", tab: "Settings" },
};
const OWNER_TABS = ["Mandate", "Review", "Activity", "Attack lab", "Settings"];
const AGENT_TABS = ["Mandate", "Ask", "Activity", "Settings"];

function tabs(role, on) {
  const list = role === "owner" ? OWNER_TABS : AGENT_TABS;
  const a = (t) => `<a href="#" class="${t === on ? "on" : ""}">${t}${t === "Review" ? '<span class="count">1</span>' : ""}</a>`;
  const b = (t) => `<a href="#" class="${t === on ? "on" : ""}">${t === "Attack lab" ? "Attack" : t}</a>`;
  return { top: `<nav class="tabs">${list.map(a).join("")}</nav>`,
           bottom: `<nav class="bottom ${list.length === 4 ? "four" : ""}">${list.map(b).join("")}</nav>` };
}

const SEAL = `<svg class="seal" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="none" stroke="var(--approve)" stroke-width="2"/><circle cx="28" cy="28" r="20" fill="none" stroke="var(--approve)" stroke-width="1" stroke-dasharray="2 3"/><path d="M18 29l7 7 13-15" fill="none" stroke="var(--approve)" stroke-width="3"/></svg>`;

const body = {
  mandate: () => `
  <main class="main rows-auto-fill">
    <section class="c12 cheque"><svg class="guilloche" data-guilloche aria-hidden="true"></svg>
      <div class="cheque-in">
        <div class="c12 meta-line"><span>Spending mandate issued by Nabil</span><span class="serial">No. 97E9 D492, valid to 17 Nov 2026</span></div>
        <div class="c8"><div class="amount fig">1,000.00<small>USD</small></div>
          <p class="note">Agents below may spend within their limits. 100.00 USD is held back and can never be spent.</p></div>
        <div class="c4 seal-cell"><div class="seal-line">${SEAL}<p><b>History intact</b>22 records, ledger checks pass</p></div>
          <a href="#">Anchored on Base Sepolia, block 48219690</a></div>
        <div class="c12 alloc" role="img" aria-label="Spent 0, waiting 0, free 900, protected 100"><i style="width:90%" class="hatch"></i><i style="width:10%;background:var(--approve)"></i></div>
        <div class="c12 legend">
          <div><span><i class="sw" style="background:var(--ink)"></i>Spent</span><b class="fig">0.00</b></div>
          <div><span><i class="sw" style="background:var(--held)"></i>Waiting to settle</span><b class="fig">0.00</b></div>
          <div><span><i class="sw hatch" style="border:1px solid var(--rule)"></i>Free to spend</span><b class="fig">900.00</b></div>
          <div><span><i class="sw" style="background:var(--approve)"></i>Protected</span><b class="fig">100.00</b></div>
        </div></div></section>

    <section class="c6 sec ledger">
      <div class="sec-head"><h2 class="fig">Who may spend</h2><span class="meta">Updated 08:41</span></div>

function screenHtml(name) {
  if (name === "signin") return `
  <div class="signin">
    <section class="cheque"><svg class="guilloche" data-guilloche aria-hidden="true"></svg>
      <div class="cheque-in"><b class="fig" style="font-size:1.25rem">Budget Kernel</b>
        <div><p class="tagline fig">Models propose. The kernel decides.</p>
          <p class="note" style="max-width:34rem">Give an AI agent a budget it cannot overspend. Every payment is checked against the owner's limits before any money moves.</p></div>
        <span class="serial dim">Settles on Base Sepolia testnet</span></div></section>
    <section class="side">
      <div class="sec-head"><h2 class="fig">Sign in</h2><span class="meta">Demo accounts</span></div>
      <div class="demo"><button class="btn ghost">Nabil<span>Owner</span></button><button class="btn ghost">Ops bot<span>Manager</span></button><button class="btn ghost">Research bot<span>Agent</span></button></div>
      <div class="or">Or paste an API key</div>
      <input class="field" type="password" aria-label="API key"><button class="btn wide" style="margin-top:0.75rem">Sign in</button>
      <p class="dim" style="font-size:0.8125rem;margin-top:1rem">The key is kept in this tab's memory only and disappears on reload.</p>
    </section>
  </div>`;
  const s = screens[name], t = tabs(s.role, s.tab);
  return `<div class="app">${document.getElementById(s.role === "owner" ? "t-top-owner" : "t-top-agent").innerHTML}${t.top}${body[name]()}${t.bottom}</div>`;
}

function guilloche() {
  document.querySelectorAll("[data-guilloche]").forEach((svg) => {
    const w = 1200, h = 400, ns = "http://www.w3.org/2000/svg";
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`); svg.setAttribute("preserveAspectRatio", "none");
    for (let k = 0; k < 26; k++) {
      let d = "";
      for (let x = 0; x <= w; x += 8) {
        const y = h / 2 + Math.sin(x / 70 + k * 0.24) * (70 + 50 * Math.sin(x / 260 + k * 0.5)) + Math.sin(x / 23 + k) * 6;
        d += (x ? "L" : "M") + x + " " + y.toFixed(1);
      }
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", d); p.setAttribute("fill", "none");
      p.setAttribute("stroke", k % 2 ? "#c9d3c6" : "#d8dfd2"); p.setAttribute("stroke-width", "0.8"); p.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(p);
    }
  });
}

const params = new URLSearchParams(location.search);
const root = document.getElementById("root");
if (params.get("screen")) {
  root.innerHTML = screenHtml(params.get("screen"));
  guilloche();
} else {
  // Gallery: each screen rendered at a real viewport size in an iframe, scaled to fit the column.
  const sizes = [[1366, 768], [1920, 1080], [2560, 1440], [390, 844]];
  let size = sizes[1];
  root.innerHTML = `<div class="gallery"><h1 class="fig">Budget Kernel, UI revision 3</h1>
    <p class="lead">Every screen is rendered at a real viewport size and scaled down to fit here. Pick a size: the composition fills the frame edge to edge at every desktop size and zooms uniformly between them.</p>
    <div class="controls">${sizes.map(([w, h]) => `<button data-w="${w}" data-h="${h}">${w} × ${h}</button>`).join("")}</div>
    <div class="shots"></div></div>`;
  const shots = root.querySelector(".shots");
  function render() {
    root.querySelectorAll(".controls button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.w === size[0])));
    shots.style.gridTemplateColumns = size[0] < 600 ? "repeat(auto-fill, minmax(14rem, 1fr))" : "";
    shots.innerHTML = Object.entries(screens).map(([k, s]) =>
      `<div class="shot"><p>${s.title}</p><div class="viewport" data-k="${k}"><iframe src="?screen=${k}" width="${size[0]}" height="${size[1]}" title="${s.title}"></iframe></div></div>`).join("");
    fit();
  }
  function fit() {
    shots.querySelectorAll(".viewport").forEach((v) => {
      const scale = v.clientWidth / size[0];
      v.style.height = size[1] * scale + "px";
      v.querySelector("iframe").style.transform = `scale(${scale})`;
    });
  }
  root.querySelectorAll(".controls button").forEach((b) => b.addEventListener("click", () => { size = [+b.dataset.w, +b.dataset.h]; render(); }));
  addEventListener("resize", fit);
  render();
}
</script>
